    <text x="59" y="149" font-size="65" font-weight="700" fill="#f5f8ff">Open Crate SDK</text>
    <text x="62" y="197" font-size="24" fill="#c1cee1">Seal bytes. Build beyond documents.</text>
    <text x="62" y="235" font-size="17" fill="#93a8c5">A small Rust API for JSON, messages and application data.</text>
    <rect x="62" y="278" width="74" height="32" rx="16" fill="#243a56"/>
