<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Open Crate SDK</title>
  <desc id="desc">Seal JSON, messages and other application bytes into an authenticated envelope using the Open Crate core.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101b31"/><stop offset="1" stop-color="#172940"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#76d9f7"/><stop offset="1" stop-color="#5289ef"/></linearGradient>
    <linearGradient id="warm" x2="1" y2="1"><stop stop-color="#ffc487"/><stop offset="1" stop-color="#ed8e62"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="996" cy="179" r="162" fill="#5289ef" opacity=".12" filter="url(#glow)"/>
